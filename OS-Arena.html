<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OS-Arena</title>
<style>
:root{color-scheme:dark;--bg:#0d1a21;--panel:rgba(9,20,27,.94);--ink:#e6f1f5;--mute:#8fa9b5;--ally:#3fd0ff;--foe:#ff6b5a;--line:#2a4552;--warn:#ffc857;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Bahnschrift","DIN Alternate","Trebuchet MS",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.hide{display:none!important}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,12,16,.82);padding:16px;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;width:min(440px,100%);max-height:100%;overflow:auto}
h1{margin:0;font-size:34px;letter-spacing:.5px}h2,h3{margin:14px 0 8px}
.sub,.mute{color:var(--mute);margin:4px 0 12px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:12px 0}dt{color:var(--mute)}dd{margin:0;text-align:right}
select{background:#12262f;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;margin-left:8px}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;background:var(--ally);color:#06222c;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.btn:focus-visible,select:focus-visible,.item:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.slot{display:flex;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.item{display:block;width:100%;text-align:left;padding:10px;margin-bottom:6px;background:#12262f;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;cursor:pointer}
.tb{position:fixed;display:none;border:2px solid var(--ally);border-radius:50%;background:rgba(9,20,27,.55);color:var(--ink);font-size:26px;align-items:center;justify-content:center;touch-action:none;min-width:48px;min-height:48px}
body.touch .tb{display:flex}
#bAtk{width:96px;height:96px;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);background:rgba(255,107,90,.35);border-color:var(--foe)}
#bSp{width:68px;height:68px;right:calc(env(safe-area-inset-right,0px) + 128px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);background:linear-gradient(to top,var(--warn) calc(var(--f,0)*1%),rgba(9,20,27,.55) 0);border-color:var(--warn)}
#bSp.rdy{box-shadow:0 0 0 4px rgba(255,200,87,.45)}
#bInst{width:84px;height:84px;right:calc(env(safe-area-inset-right,0px) + 36px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);background:rgba(255,200,87,.35);border-color:var(--warn);text-align:center}
#bInv{width:52px;height:52px;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<button class="tb" id="bAtk" aria-label="Angriff">◎</button>
<button class="tb" id="bSp" aria-label="Spezial">★</button>
<button class="tb hide" id="bInst" aria-label="Einbauen">⬆</button>
<button class="tb" id="bInv" aria-label="Inventar">▤</button>

<div id="start" class="ov"><div class="card">
<h1>OS-Arena</h1><p class="sub">Du bekommst das System, das du gerade benutzt. Dein Team besteht nur aus deinem System. Klaue Hardware und zerstöre das gegnerische Rack.</p>
<dl id="det"></dl>
<canvas id="lg" width="96" height="96" style="width:48px;height:48px;display:block;margin:0 auto 8px;cursor:default"></canvas>
<p class="mute" id="hint"></p>
<button class="btn" id="go">Match starten</button></div></div>

<div id="inv" class="ov hide"><div class="card">
<h2>System-Monitor</h2><p class="mute">Das Match läuft weiter. Tippe ein Teil im Rucksack, um es einzubauen.</p>
<div id="slots"></div><h3>Rucksack</h3><div id="bag"></div>
<button class="btn" id="invx">Schließen</button></div></div>

<div id="end" class="ov hide"><div class="card"><h1 id="et"></h1><p class="sub" id="es"></p>
<button class="btn" id="again">Nochmal spielen</button></div></div>

<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
let W,H,DPR,Z=1;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;Z=Math.max(.5,Math.min(1.1,Math.min(W/900,H/600)))}
addEventListener('resize',rs);rs();

/* ---------- Daten ---------- */
const WORLD={w:1600,h:1000};
const CL={
 windows:{n:'Windows',k:'Tank / Allrounder',hp:150,sp:185,dmg:15,cd:.5,rng:300,sr:140,sd:55,g:'Win'},
 linux:{n:'Linux',k:'Tech / Support',hp:90,sp:250,dmg:8,cd:.26,rng:320,sr:120,sd:35,g:'Lnx',slow:1},
 apple:{n:'Apple',k:'Agil / Elegant',hp:100,sp:225,dmg:19,cd:.52,rng:380,sr:130,sd:50,g:'Mac'},
 android:{n:'Android',k:'Offense',hp:110,sp:215,dmg:11,cd:.3,rng:300,sr:160,sd:40,g:'And'}};
const SL=['cpu','ram','gpu','ssd'],LBL={cpu:'CPU',ram:'RAM',gpu:'GPU',ssd:'SSD'},SC={cpu:'#ffc857',ram:'#7be0a4',gpu:'#c792ff',ssd:'#6ab7ff'};
const NM={cpu:['Core i5','Ryzen 7','Core i9'],ram:['DDR4 8 GB','DDR5 16 GB','DDR5 64 GB'],gpu:['GTX 1650','RTX 4070','RTX 4090'],ssd:['SATA SSD','NVMe Gen3','NVMe Gen5']};
const OBS=[[700,200,200,40],[700,760,200,40],[780,440,40,120],[330,300,40,150],[330,550,40,150],[1230,300,40,150],[1230,550,40,150]];
const RK=[{team:0,x:30,y:420,w:60,h:160,hp:800,max:800},{team:1,x:1510,y:420,w:60,h:160,hp:600,max:600}];
const SOLID=OBS.concat(RK.map(r=>[r.x,r.y,r.w,r.h]));

/* ---------- Erkennung ---------- */
function detect(){
 const ua=navigator.userAgent,tp=navigator.maxTouchPoints||0;
 const ipad=/Macintosh/.test(ua)&&tp>1,mobile=/Android|iPhone|iPad|iPod/i.test(ua)||ipad;
 let os='windows';
 if(/Android/i.test(ua))os='android';else if(mobile||/Mac/i.test(ua))os='apple';else if(/Linux|X11|CrOS/i.test(ua))os='linux';
 let ram=navigator.deviceMemory,est=false;
 if(!ram){est=true;ram=mobile&&os!=='apple'?5:8}
 const cores=navigator.hardwareConcurrency||4;
 let gpu=1,gname='unbekannt';
 try{const gl=document.createElement('canvas').getContext('webgl'),x=gl.getExtension('WEBGL_debug_renderer_info');
  if(x){gname=gl.getParameter(x.UNMASKED_RENDERER_WEBGL);
   gpu=/RTX|Radeon RX|Apple M|Arc/i.test(gname)?3:/GTX|Iris|Adreno|Mali-G|Apple/i.test(gname)?2:1}}catch(e){}
 if(gname==='unbekannt'&&os==='apple')gpu=2;
 return{os,mobile,ram,est,cores,gpu,hw:{ram,cores,gpu}};
}
const DET=detect();
let mode=(matchMedia('(pointer:coarse)').matches||DET.mobile)?'touch':'desktop';
function setMode(m){if(mode!==m){mode=m}document.body.classList.toggle('touch',mode==='touch')}
setMode(mode);

/* ---------- Einheiten ---------- */
let units,proj,drops,fx,state='menu',P,OSsel=DET.os,kills=0,toast={t:0,s:''},uid=0;
function stats(u){const t=k=>u.slots[k]?u.slots[k].tier:0;
 return{maxhp:Math.round(u.cl.hp*(u.hm||1)),maxsh:u.hw.ram*5+20*t('ram'),cd:u.cl.cd/(1+.025*Math.min(u.hw.cores,16))/(1+.12*t('cpu')),
  spr:u.cl.sr*(.9+.1*u.hw.gpu)*(1+.15*t('gpu')),reg:1.5*t('ssd'),spd:u.cl.sp}}
function mk(team,os,hw,isP){return{id:uid++,team,os,cl:CL[os],hw,isP,hm:team?.7:isP?1.25:1,x:0,y:0,vx:0,vy:0,r:16,hp:1,sh:0,cd:0,ch:0,dead:0,ang:0,slow:0,slots:{cpu:null,ram:null,gpu:null,ssd:null},bag:[],ai:{t:0,s:1}}}
function spawn(u){const i=units.filter(a=>a.team===u.team).indexOf(u);u.x=u.team?1450:150;u.y=360+i*140;u.vx=u.vy=0;
 if(!u.isP){u.slots={cpu:null,ram:null,gpu:null,ssd:null};loot(u,u.team?2:1)}const s=stats(u);u.hp=s.maxhp;u.sh=s.maxsh;u.dead=0;u.ch=0}
function loot(u,n){for(let i=0;i<n;i++){const k=SL[Math.random()*4|0],t=Math.random()<.7?1:2;if(!u.slots[k])u.slots[k]={slot:k,tier:t,name:NM[k][t-1]}}}
function newMatch(){
 units=[];proj=[];drops=[];fx=[];kills=0;RK.forEach(r=>r.hp=r.max);
 const os4=Object.keys(CL),rnd=a=>a[Math.random()*a.length|0];
 const hwb=()=>({ram:rnd([4,8,16]),cores:rnd([4,6,8,12,16]),gpu:rnd([1,2,3])});
 P=mk(0,OSsel,DET.hw,true);units.push(P);
 for(let i=0;i<2;i++)units.push(mk(0,OSsel,hwb()));
 const foe=rnd(os4.filter(k=>k!==OSsel));for(let i=0;i<3;i++)units.push(mk(1,foe,hwb()));
 units.forEach(spawn);state='play';say('Treffer und Spezial klauen Hardware, Besiegte lassen alles fallen')}
function say(s){toast={t:3,s}}
function near(u,max){let b=null,bd=max;for(const o of units)if(o.team!==u.team&&!o.dead){const d=Math.hypot(o.x-u.x,o.y-u.y);if(d<bd){bd=d;b=o}}return b}

/* ---------- Komponenten ---------- */
function equip(u,it){const old=u.slots[it.slot];u.slots[it.slot]=it;if(old)u.bag.push(old);
 if(it.slot==='ram'){const s=stats(u);u.sh=Math.min(s.maxsh,u.sh+20*(it.tier-(old?old.tier:0)))}}
function pickup(u,d){drops.splice(drops.indexOf(d),1);const it={slot:d.slot,tier:d.tier,name:NM[d.slot][d.tier-1]},cur=u.slots[it.slot];
 if(!cur||cur.tier<it.tier){equip(u,it);if(u.isP)say(LBL[it.slot]+' eingebaut: '+it.name+' (Stufe '+it.tier+')')}
 else{u.bag.push(it);if(u.isP)say(it.name+' im Rucksack (bereits besseres Teil verbaut)')}}
function nearDrop(u,r){return drops.find(d=>Math.hypot(d.x-u.x,d.y-u.y)<r*1.5)}
function install(){if(state!=='play'||P.dead)return;const d=nearDrop(P,46);if(d)pickup(P,d)}

/* ---------- Kampf ---------- */
function shoot(u,a){const sp=520;proj.push({x:u.x+Math.cos(a)*20,y:u.y+Math.sin(a)*20,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,team:u.team,dmg:u.cl.dmg*(u.team?.6:1),life:u.cl.rng/sp,src:u,r:u.isP&&mode==='touch'?9:6})}
function hurt(u,d,src){if(u.dead)return;if(u.sh>0){const a=Math.min(u.sh,d);u.sh-=a;d-=a}u.hp-=d;if(src){src.ch=Math.min(100,src.ch+(src.isP?20:12));if(src.isP&&Math.random()<.2)steal(src,u)}if(u.hp<=0)die(u,src)}
function steal(u,o){const ks=SL.filter(k=>o.slots[k]);if(!ks.length)return;const k=ks[Math.random()*ks.length|0],it=o.slots[k];o.slots[k]=null;o.sh=Math.min(o.sh,stats(o).maxsh);const cur=u.slots[k];
 if(!cur||cur.tier<it.tier)equip(u,it);else u.bag.push(it);fx.push({x:o.x,y:o.y,r:6,mr:34,t:.3,c:'#ffc857'});
 if(u.isP)say('Geklaut: '+LBL[k]+' '+it.name+' (Stufe '+it.tier+')');else if(o.isP)say('Dein '+LBL[k]+' wurde geklaut!')}
function die(u,src){u.dead=u.isP?3:6;if(!u.isP){const r=Math.random(),add=(sl,t)=>drops.push({x:u.x+(Math.random()-.5)*50,y:u.y+(Math.random()-.5)*50,slot:sl,tier:t,t:30});SL.forEach(k=>{if(u.slots[k])add(k,u.slots[k].tier)});add(SL[Math.random()*4|0],r<.55?1:r<.85?2:3);u.slots={cpu:null,ram:null,gpu:null,ssd:null}}
 fx.push({x:u.x,y:u.y,r:10,mr:50,t:.4,c:'#fff'});if(src&&src.isP){kills++;say('Besiegt! Komponente gedroppt, geh drüber und baue sie ein')}}
function special(u){const s=stats(u);u.ch=0;fx.push({x:u.x,y:u.y,r:10,mr:s.spr,t:.5,c:u.team?'#ff6b5a':'#ffc857'});
 for(const o of units)if(o.team!==u.team&&!o.dead&&Math.hypot(o.x-u.x,o.y-u.y)<s.spr+o.r){steal(u,o);hurt(o,u.cl.sd*(u.team?.6:1),u);if(u.cl.slow)o.slow=2.5}
 const rk=RK[1-u.team];if(Math.hypot(rk.x+rk.w/2-u.x,rk.y+rk.h/2-u.y)<s.spr+60)hitRack(rk,u.cl.sd)}
function hitRack(r,d){if(state!=='play')return;r.hp-=d;if(r.hp<=0){r.hp=0;finish(1-r.team)}}
function finish(win){state='end';$('#end').classList.remove('hide');$('#et').textContent=win===0?'Sieg':'Niederlage';
 $('#es').textContent=(win===0?'Das gegnerische Server-Rack ist offline.':'Dein Server-Rack wurde zerstört.')+' Besiegte Gegner: '+kills+'.'}
function inR(x,y,o,p){return x>o[0]-p&&x<o[0]+o[2]+p&&y>o[1]-p&&y<o[1]+o[3]+p}
function push(u){for(const o of SOLID){const cx=Math.max(o[0],Math.min(u.x,o[0]+o[2])),cy=Math.max(o[1],Math.min(u.y,o[1]+o[3]));let dx=u.x-cx,dy=u.y-cy,d=Math.hypot(dx,dy);
 if(d<u.r){if(!d){dx=1;d=1}u.x+=dx/d*(u.r-d);u.y+=dy/d*(u.r-d)}}
 u.x=Math.max(u.r,Math.min(WORLD.w-u.r,u.x));u.y=Math.max(u.r,Math.min(WORLD.h-u.r,u.y))}

function act(u,mx,my,ang,fire,spec,dt){
 const s=stats(u),sp=s.spd*(u.team?.8:1)*(u.slow>0?.55:1),l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 const k=Math.min(1,dt*9);u.vx+=(mx*sp-u.vx)*k;u.vy+=(my*sp-u.vy)*k;u.x+=u.vx*dt;u.y+=u.vy*dt;push(u);
 u.cd-=dt;u.slow-=dt;u.ang=ang;u.hp=Math.min(s.maxhp,u.hp+s.reg*dt);
 if(fire&&u.cd<=0){u.cd=s.cd*(u.isP?.85:u.team?2:1.5);shoot(u,ang)}
 if(spec&&u.ch>=100)special(u)}

function ai(b,dt){
 b.ai.t-=dt;if(b.ai.t<=0){b.ai.t=.8+Math.random();b.ai.s=Math.random()<.5?-1:1}
 const tg=near(b,520),s=stats(b),rk=RK[1-b.team];let mx=0,my=0,ang=b.ang,fire=false,spec=false;
 const dr=nearDrop(b,260);
 if(tg){const dx=tg.x-b.x,dy=tg.y-b.y,d=Math.hypot(dx,dy)||1,want=b.cl.rng*.7,k=d>want?1:d<want*.6?-1:0;
  ang=Math.atan2(dy,dx)+(Math.random()-.5)*(b.team?.9:.3);mx=dx/d*k-dy/d*b.ai.s*.8;my=dy/d*k+dx/d*b.ai.s*.8;fire=d<b.cl.rng;spec=d<s.spr}
 else if(dr){mx=dr.x-b.x;my=dr.y-b.y}
 else{const dx=rk.x+rk.w/2-b.x,dy=rk.y+rk.h/2-b.y,d=Math.hypot(dx,dy);ang=Math.atan2(dy,dx);
  if(d>b.cl.rng*.8){mx=dx;my=dy+b.ai.s*120}else{fire=true;spec=d<s.spr}}
 const d2=nearDrop(b,30);if(d2)pickup(b,d2);
 act(b,mx,my,ang,fire,spec,dt)}

/* ---------- Eingabe (einheitliche Actions) ---------- */
const K={},M={x:0,y:0,l:0},joy={id:null,ox:0,oy:0,x:0,y:0},atk={id:null,sx:0,sy:0,dx:0,dy:0},ins={id:null,y:0};
let specReq=false;
function toggleInv(){const o=$('#inv');o.classList.toggle('hide');if(!o.classList.contains('hide'))renderInv()}
function renderInv(){
 $('#slots').innerHTML=SL.map(k=>{const it=P.slots[k];return `<div class="slot"><b>${LBL[k]}</b><span>${it?it.name+' (Stufe '+it.tier+')':'leer'}</span></div>`}).join('');
 $('#bag').innerHTML=P.bag.length?P.bag.map((it,i)=>`<button class="item" data-i="${i}">${LBL[it.slot]}: ${it.name} (Stufe ${it.tier})</button>`).join(''):'<p class="mute">Leer. Besiegte Gegner lassen Komponenten fallen.</p>'}
$('#bag').onclick=e=>{const b=e.target.closest('.item');if(b){equip(P,P.bag.splice(+b.dataset.i,1)[0]);renderInv()}};
$('#invx').onclick=toggleInv;
addEventListener('keydown',e=>{setMode('desktop');K[e.code]=1;
 if(state!=='play')return;
 if(e.code==='Tab'||e.code==='KeyI'){e.preventDefault();toggleInv()}
 if(e.code==='KeyE'||e.code==='KeyF')install();
 if(e.code==='Space'){e.preventDefault();specReq=true}});
addEventListener('keyup',e=>K[e.code]=0);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('pointerdown',e=>{
 setMode(e.pointerType==='touch'?'touch':'desktop');
 if(state!=='play'||e.target.closest('.ov'))return;
 const t=e.target.closest('.tb');
 if(t){if(t.id==='bAtk'){atk.id=e.pointerId;atk.sx=e.clientX;atk.sy=e.clientY;atk.dx=atk.dy=0}
  else if(t.id==='bSp')specReq=true;else if(t.id==='bInst'){ins.id=e.pointerId;ins.y=e.clientY}
  else if(t.id==='bInv')toggleInv();return}
 if(e.pointerType==='touch'){if(e.clientX<W/2&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0}}
 else{M.x=e.clientX;M.y=e.clientY;if(e.button===0)M.l=1;if(e.button===2)specReq=true}});
addEventListener('pointermove',e=>{
 if(e.pointerType!=='touch'){M.x=e.clientX;M.y=e.clientY}
 if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),m=55;if(d>m){joy.ox+=dx/d*(d-m);joy.oy+=dy/d*(d-m);dx=dx/d*m;dy=dy/d*m}joy.x=dx/m;joy.y=dy/m}
 if(e.pointerId===atk.id){atk.dx=e.clientX-atk.sx;atk.dy=e.clientY-atk.sy}});
function up(e){
 if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0}
 if(e.pointerId===atk.id){atk.id=null}
 if(e.pointerId===ins.id){const dy=e.clientY-ins.y;ins.id=null;if(dy<-20||Math.abs(dy)<12)install()}
 if(e.pointerType!=='touch'&&e.button===0)M.l=0}
addEventListener('pointerup',up);addEventListener('pointercancel',up);

function cam(){const vw=W/Z,vh=H/Z;return{x:Math.max(0,Math.min(WORLD.w-vw,P.x-vw/2)),y:Math.max(0,Math.min(WORLD.h-vh,P.y-vh/2))}}
function playerCtl(dt){
 let mx=0,my=0,ang=P.ang,fire=false;
 if(mode==='desktop'){mx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);my=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);
  const c=cam();ang=Math.atan2(M.y/Z+c.y-P.y,M.x/Z+c.x-P.x);fire=!!M.l}
 else{mx=joy.x;my=joy.y;fire=atk.id!==null;
  if(fire){if(Math.hypot(atk.dx,atk.dy)>14)ang=Math.atan2(atk.dy,atk.dx);else{const t=near(P,450);if(t)ang=Math.atan2(t.y-P.y,t.x-P.x)}}}
 act(P,mx,my,ang,fire,specReq,dt);specReq=false}

/* ---------- Update ---------- */
function update(dt){
 for(const u of units){if(u.dead>0){u.dead-=dt;if(u.dead<=0)spawn(u);continue}
  u.isP?playerCtl(dt):ai(u,dt)}
 for(let i=proj.length-1;i>=0;i--){const p=proj[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;let kill=p.life<=0;
  if(!kill)for(const o of OBS)if(inR(p.x,p.y,o,0)){kill=true;break}
  if(!kill){const rk=RK[1-p.team];if(inR(p.x,p.y,[rk.x,rk.y,rk.w,rk.h],0)){hitRack(rk,p.dmg);p.src.ch=Math.min(100,p.src.ch+6);kill=true}}
  if(!kill)for(const o of units)if(o.team!==p.team&&!o.dead&&Math.hypot(o.x-p.x,o.y-p.y)<o.r+p.r){hurt(o,p.dmg,p.src);kill=true;break}
  if(kill)proj.splice(i,1)}
 for(let i=drops.length-1;i>=0;i--){drops[i].t-=dt;if(drops[i].t<=0)drops.splice(i,1)}
 for(let i=fx.length-1;i>=0;i--){fx[i].t-=dt;fx[i].r+=(fx[i].mr-fx[i].r)*Math.min(1,dt*10);if(fx[i].t<=0)fx.splice(i,1)}
 toast.t-=dt;
 const nd=!P.dead&&nearDrop(P,46);$('#bInst').classList.toggle('hide',!nd);
 $('#bSp').style.setProperty('--f',P.ch);$('#bSp').classList.toggle('rdy',P.ch>=100)}

/* ---------- Zeichnen ---------- */
function logo(os,x,y,r,c){c=c||ctx;c.save();c.translate(x,y);const k=r/16;c.scale(k,k);
 if(os==='windows'){c.fillStyle='#4aa3ff';[[-8,-8],[1,-8],[-8,1],[1,1]].forEach(p=>c.fillRect(p[0],p[1],7,7))}
 else if(os==='linux'){c.fillStyle='#4a5366';c.beginPath();c.ellipse(0,2,7,9,0,0,6.3);c.fill();c.fillStyle='#fff';c.beginPath();c.ellipse(0,4,4.2,6,0,0,6.3);c.fill();c.fillStyle='#4a5366';c.beginPath();c.arc(0,-8,4.5,0,6.3);c.fill();c.fillStyle='#fff';c.fillRect(-3,-9.5,2,2);c.fillRect(1,-9.5,2,2);c.fillStyle='#f5a623';c.beginPath();c.moveTo(-2,-6.5);c.lineTo(2,-6.5);c.lineTo(0,-3.5);c.fill();c.fillRect(-8,9,6,2.5);c.fillRect(2,9,6,2.5)}
 else if(os==='apple'){c.fillStyle='#e6f1f5';c.beginPath();c.arc(-3.2,2,6,0,6.3);c.fill();c.beginPath();c.arc(3.2,2,6,0,6.3);c.fill();c.fillRect(-5,-2,10,6);c.fillStyle='#7be0a4';c.beginPath();c.ellipse(2.5,-7,1.8,3.8,.7,0,6.3);c.fill();c.fillStyle='#10242d';c.beginPath();c.arc(9,-1,3.6,0,6.3);c.fill()}
 else{c.fillStyle='#3ddc84';c.beginPath();c.arc(0,-1,8,Math.PI,0);c.fill();c.fillRect(-8,2,16,8);c.strokeStyle='#3ddc84';c.lineWidth=1.6;c.beginPath();c.moveTo(-4,-7);c.lineTo(-6.5,-11);c.moveTo(4,-7);c.lineTo(6.5,-11);c.stroke();c.fillStyle='#10242d';c.beginPath();c.arc(-3.5,-4,1.4,0,6.3);c.fill();c.beginPath();c.arc(3.5,-4,1.4,0,6.3);c.fill()}
 c.restore()}
function bar(x,y,w,h,f,c){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x,y,w,h);ctx.fillStyle=c;ctx.fillRect(x,y,w*Math.max(0,Math.min(1,f)),h)}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#0d1a21';ctx.fillRect(0,0,W,H);
 const c=cam();ctx.setTransform(DPR*Z,0,0,DPR*Z,-c.x*Z*DPR,-c.y*Z*DPR);
 ctx.fillStyle='#142730';ctx.fillRect(0,0,WORLD.w,WORLD.h);
 ctx.fillStyle='rgba(63,208,255,.07)';ctx.fillRect(0,0,200,WORLD.h);ctx.fillStyle='rgba(255,107,90,.07)';ctx.fillRect(WORLD.w-200,0,200,WORLD.h);
 ctx.strokeStyle='#1d3743';ctx.lineWidth=1;ctx.beginPath();
 for(let x=0;x<=WORLD.w;x+=100){ctx.moveTo(x,0);ctx.lineTo(x,WORLD.h)}for(let y=0;y<=WORLD.h;y+=100){ctx.moveTo(0,y);ctx.lineTo(WORLD.w,y)}ctx.stroke();
 ctx.strokeStyle='#3a5a69';ctx.lineWidth=4;ctx.strokeRect(0,0,WORLD.w,WORLD.h);
 ctx.fillStyle='#2b4755';for(const o of OBS)ctx.fillRect(o[0],o[1],o[2],o[3]);
 for(const r of RK){const col=r.team?'#ff6b5a':'#3fd0ff';ctx.fillStyle='#0a161c';ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle=col;ctx.lineWidth=3;ctx.strokeRect(r.x,r.y,r.w,r.h);
  ctx.fillStyle=col;for(let i=0;i<6;i++)ctx.fillRect(r.x+10,r.y+12+i*24,r.w-20,8);bar(r.x-10,r.y-14,r.w+20,6,r.hp/r.max,col)}
 const tm=performance.now()/400;
 for(const d of drops){const y=d.y+Math.sin(tm+d.x)*3;ctx.fillStyle=SC[d.slot];ctx.fillRect(d.x-14,y-10,28,20);ctx.fillStyle='#06222c';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(LBL[d.slot],d.x,y+4);
  for(let i=0;i<d.tier;i++){ctx.fillStyle='#fff';ctx.fillRect(d.x-8+i*8,y+13,5,3)}}
 for(const f of fx){ctx.globalAlpha=Math.max(0,f.t*2);ctx.strokeStyle=f.c;ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.stroke();ctx.globalAlpha=1}
 for(const u of units){if(u.dead>0)continue;const col=u.team?'#ff6b5a':'#3fd0ff';
  ctx.fillStyle='#10242d';ctx.beginPath();ctx.arc(u.x,u.y,u.r,0,7);ctx.fill();ctx.strokeStyle=u.isP?'#fff':col;ctx.lineWidth=u.isP?4:3;ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(u.x+Math.cos(u.ang)*24,u.y+Math.sin(u.ang)*24);ctx.stroke();
  logo(u.os,u.x,u.y,u.r);
  const s=stats(u);bar(u.x-18,u.y-28,36,4,u.hp/s.maxhp,'#7be0a4');if(s.maxsh)bar(u.x-18,u.y-33,36,3,u.sh/s.maxsh,'#6ab7ff')}
 for(const p of proj){ctx.fillStyle=p.team?'#ff9a8d':'#9be8ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
 if(!P.dead&&nearDrop(P,46)&&mode==='desktop'){ctx.fillStyle='#ffc857';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('E: einbauen',P.x,P.y-44)}
 /* HUD */
 ctx.setTransform(DPR,0,0,DPR,0,0);const s=stats(P),x0=12,y0=12+(mode==='touch'?0:0);
 logo(P.os,x0+8,y0+8,8);ctx.textAlign='left';
 bar(x0,y0+16,150,10,P.hp/s.maxhp,'#7be0a4');bar(x0,y0+29,150,7,s.maxsh?P.sh/s.maxsh:0,'#6ab7ff');bar(x0,y0+39,150,7,P.ch/100,'#ffc857');
 ctx.font='12px sans-serif';ctx.fillStyle='#8fa9b5';ctx.fillText(SL.map(k=>LBL[k]+' '+(P.slots[k]?P.slots[k].tier:'-')).join('   '),x0,y0+62);
 ctx.fillStyle=P.ch>=100?'#ffc857':'#8fa9b5';ctx.fillText(P.ch>=100?(mode==='touch'?'Spezial bereit':'Spezial bereit (Leertaste / RMB)'):'Spezial lädt: '+(P.ch|0)+' %',x0,y0+78);
 const cx=W/2;ctx.textAlign='center';bar(cx-190,12,170,10,RK[0].hp/RK[0].max,'#3fd0ff');bar(cx+20,12,170,10,RK[1].hp/RK[1].max,'#ff6b5a');
 ctx.fillStyle='#8fa9b5';ctx.font='12px sans-serif';ctx.fillText('Dein Rack',cx-105,36);ctx.fillText('Gegner-Rack',cx+105,36);
 if(toast.t>0){ctx.fillStyle='#e6f1f5';ctx.font='bold 15px sans-serif';ctx.fillText(toast.s,cx,H-(mode==='touch'?16:28))}
 if(P.dead>0){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,H/2-34,W,68);ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText('Neustart in '+Math.ceil(P.dead)+' s (deine Hardware bleibt erhalten)',cx,H/2+7)}
 if(mode==='touch'&&joy.id!==null){ctx.strokeStyle='rgba(63,208,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(joy.ox,joy.oy,55,0,7);ctx.stroke();ctx.fillStyle='rgba(63,208,255,.5)';ctx.beginPath();ctx.arc(joy.ox+joy.x*55,joy.oy+joy.y*55,24,0,7);ctx.fill()}
 if(mode==='desktop'&&state==='play'){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(M.x,M.y,9,0,7);ctx.moveTo(M.x-14,M.y);ctx.lineTo(M.x+14,M.y);ctx.moveTo(M.x,M.y-14);ctx.lineTo(M.x,M.y+14);ctx.stroke()}}

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 if(state==='play'){update(dt);draw()}else if(state==='end'){draw()}
 requestAnimationFrame(loop)}

 const os=DET.os,cl=CL[os],s=stats({cl,hw:DET.hw,slots:{}}),lc=$('#lg').getContext('2d');lc.clearRect(0,0,96,96);logo(os,48,48,40,lc);
